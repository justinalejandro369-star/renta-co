name: verificar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Tests
        run: python -m unittest discover -s engine/tests -t . -v

      - name: Expediente de ejemplo
        run: python -m engine.cli calcular --expediente expediente.ejemplo

      - name: Parámetros
        run: python -m engine.cli parametros --anio 2025

  privacidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sin datos personales en el repositorio
        run: python scripts/escanear_privacidad.py .
