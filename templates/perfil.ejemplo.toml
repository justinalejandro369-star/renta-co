#  perfil.toml — datos del contribuyente
#
#  ⚠ Este archivo se queda en TU máquina. Está en .gitignore. No lo subas
#    a ningún repositorio ni lo pegues en un issue.
#
#  Todo en pesos colombianos. Los ingresos en moneda extranjera se convierten
#  con TRM diaria por `bin/renta importar` antes de llegar acá.
#
#  Deja en 0 lo que no aplique. El motor distingue "es cero" de "no lo
#  sabemos" y te avisa de lo segundo — pero solo si no lo llenas a la ligera.
#
#  Verifica en cualquier momento:  bin/renta verificar --expediente <ruta>

[contribuyente]
anio_gravable = 2025
# Residente fiscal: más de 183 días en Colombia, continuos o no, en un
# período de 365 días. Si es false, este motor NO aplica: consulta un contador.
residente_fiscal = true
# ¿Ejerces actos de comercio —vender bienes, comprar para revender— en el
# sentido del art. 20 del Código de Comercio? Prestar servicios
# profesionales NO es un acto de comercio. Decide el chequeo OBL-02: un
# comerciante que supere 30.000 UVT de patrimonio o ingresos del año
# anterior es AGENTE DE RETENCIÓN (art. 368-2) y tiene que retener,
# declarar y consignar mes a mes. Déjalo comentado si no estás seguro: el
# motor prefiere decir que no puede concluir a suponer que no.
# es_comerciante = false

# Tu nombre. El motor NO lo usa para calcular nada: lo lee el escáner de
# privacidad cuando lo corres con --perfil, para poder encontrarlo en los
# entregables ANTES de que salgan hacia el contador o hacia un issue.
#
#     python3 scripts/escanear_privacidad.py --perfil <expediente>/perfil.toml .
#
# Sin este campo, esa detección no tiene qué buscar y queda apagada — te lo
# dice con un aviso. Escribe nombre y apellidos completos.
# nombre = "Nombre Apellido Apellido"

# ── Las otras personas que salen en tus documentos ────────────────────
# Tampoco las usa el motor, y por la misma razón que el campo de arriba:
# los nombres de tus contratistas, tu cónyuge y tus dependientes aparecen
# en los extractos y en el ledger, y el escáner no puede buscar lo que no
# sabe que existe.
#
# [personas]
# conyuge      = "Nombre Apellido"
# madre        = "Nombre Apellido"
# padre        = "Nombre Apellido"
# hijos        = ["Nombre Apellido", "Nombre Apellido"]
# hermanos     = ["Nombre Apellido"]
# contratistas = ["Nombre Apellido", "Nombre Apellido"]

# ── Ingresos ──────────────────────────────────────────────────────────
[ingresos]
# Honorarios, compensación por servicios personales, prestación de servicios.
rentas_trabajo_honorarios = 0
# Rendimientos financieros, intereses, arrendamientos.
rentas_capital = 0
otras_rentas_no_laborales = 0

#  ── Lo que este motor NO liquida ────────────────────────────────────
#  Estos tres campos existen para que los DECLARES si te aplican. El motor
#  los detecta y se detiene, en vez de meterlos en la cédula equivocada y
#  darte un número creíble y equivocado.
#
#  Si dejas cualquiera de los tres en 0 sin que sea cierto, el borrador va
#  a salir completo, con aspecto de estar bien, y va a estar mal. Es el
#  único error de esta herramienta que no se ve mirando el resultado.
#
#  Salario de una relación laboral. Un asalariado no detrae costos: la
#  opción del art. 336 num. 4 solo ata a quien percibe honorarios.
rentas_laborales_salario = 0
#  Pensión. Exenta hasta 1.000 UVT mensuales (art. 206 num. 5), por una
#  regla distinta a la del 25% de rentas de trabajo.
rentas_pension = 0
#  Ganancia ocasional: venta de un activo poseído más de 2 años, herencia,
#  lotería, rifa. Tributa en cédula aparte al 15% o al 20% (arts. 314 y
#  317), no en la tabla del art. 241.
ganancia_ocasional = 0

# ── Ingresos no constitutivos de renta ────────────────────────────────
# Restan ANTES del tope del 40% y no lo consumen: es la mejor posición
# posible. No los pongas como deducción — les quita valor.
[incrngo]
aportes_obligatorios_salud_pension = 0   # planillas PILA del año
componente_inflacionario           = 0   # certificado de rendimientos
otros                              = 0

# ── Costos y gastos — SOLO se restan en la Ruta A ─────────────────────
# Cada peso exige factura electrónica o documento soporte. Los pagos a
# contratistas además exigen verificar SUS aportes (art. 108 par. 2 ET):
# si no cotizaron, la DIAN puede rechazar la totalidad del costo.
[costos]
pagos_a_contratistas  = 0
comisiones_plataforma = 0
equipo_tecnologico    = 0
internet_software     = 0
arriendo_oficina      = 0
otros                 = 0

# A qué TIPO DE RENTA pertenece cada costo. Opcional, y solo importa si
# tienes ingresos de más de un tipo.
#
# El Decreto 1625 art. 1.2.1.20.5 inciso final no topa los costos contra la
# cédula: los topa contra los ingresos menos los INCRNGO de CADA tipo. El
# exceso de un tipo NO se puede restar de otro. Si tuviste un mal año en
# honorarios y a la vez recibiste arriendos, no puedes cruzar lo uno contra
# lo otro.
#
# Si no escribes este bloque, el motor atribuye los costos a la única
# ACTIVIDAD con ingresos que tengas (rentas de trabajo u otras rentas no
# laborales; la renta de capital no es una actividad). Si tienes las dos,
# no adivina: deja los costos sin topar y te lo dice en el chequeo R-11.
#
# Valores válidos: rentas_trabajo_honorarios, rentas_capital,
#                  otras_rentas_no_laborales
#
# [costos.atribucion]
# pagos_a_contratistas = "otras_rentas_no_laborales"
# arriendo_oficina     = "rentas_trabajo_honorarios"

# ── Deducciones ───────────────────────────────────────────────────────
[deducciones]
# TOTAL de 4x1000 pagado en el año, sumando todos los bancos.
# El motor toma el 50%. Pide el certificado de GMF a cada banco.
gmf_pagado = 0

# Solo los INTERESES, no el abono a capital. Tope 1.200 UVT.
intereses_vivienda = 0

# Medicina prepagada o seguro de salud. Tope 16 UVT/mes = 192 UVT al año.
medicina_prepagada = 0

# ⚠ Solo cuenta lo aportado ANTES del 31 de diciembre del año gravable.
# Si el año ya cerró y esto está en 0, mira la tabla de sensibilidad:
# ese número es tu costo de oportunidad para el año en curso.
aportes_voluntarios = 0

# Base para la deducción del 1%: total de compras con factura electrónica
# a TU NIT o cédula, pagadas por medio electrónico. Tope de deducción 240 UVT.
compras_con_factura_electronica = 0

# Cantidad de dependientes, máximo 5. Las 72 UVT topan en 4 (art. 336 num. 3
# inciso 2), y la otra vía —el 10% de la renta de trabajo del art. 387— consume
# un dependiente DISTINTO, porque la exclusividad es por dependiente y no por
# contribuyente (Decreto 1625 art. 1.2.1.20.3). Por eso el quinto todavía vale.
# Las 72 UVT quedan FUERA del tope del 40%.
# Cuentan (definición actualizada por la Ley 2411 de 2024, desde AG2025):
#   · hijos hasta 18 años
#   · hijos de 18 a 25 estudiando, si tú financias su educación superior
#   · hijos mayores de 18 con dependencia certificada por el Ministerio de
#     Salud y Protección Social
#   · cónyuge o compañero(a) permanente, y PADRES Y HERMANOS, con ingresos
#     anuales < 260 UVT (certificado por contador público) o con dependencia
#     física o psicológica
#
# ⚠ Esta es la línea que más plata mueve de todo el archivo, y la que más
#   gente deja en 0 sin verificar. Pregunta por tus papás.
dependientes = 0

# ── Descuentos (restan del impuesto, no de la base) ────────────────────
[descuentos]
# Solo con certificación de una entidad del Régimen Tributario Especial,
# firmada por representante legal y contador o revisor fiscal.
# Una transferencia a una persona, a una colecta o a una causa informal
# vale $0 tributariamente.
#
# Da un DESCUENTO del 25% del valor donado, topado al 25% del impuesto
# (art. 257 y art. 258). Ojo con la aritmética: donar $100 ahorra $25, así
# que como jugada fiscal siempre pierdes. Tiene sentido si ibas a donar de
# todas formas.
donaciones_certificadas_rte = 0

# ── Anticipos ─────────────────────────────────────────────────────────
[anticipos]
retenciones_practicadas     = 0   # suma de todos los certificados de retención
saldo_a_favor_anio_anterior = 0

# ── Verificaciones de riesgo ──────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────
#  Año anterior — dos cuentas que la DIAN hace sola
# ─────────────────────────────────────────────────────────────────────
#
# Sin estos dos datos el motor no puede correr ni la comparación patrimonial
# (R-15) ni el beneficio de auditoría (R-16), y los dos chequeos dicen «NO SE
# PUEDE CONCLUIR». Ese «no puede concluir» NO es un aprobado.
#
# Los dos salen de tu declaración del año pasado. Si no declaraste, ponlos en
# 0 y déjalo dicho en el memo — no los borres.
[anio_anterior]

# Casilla «Total patrimonio líquido» de tu declaración del año anterior.
#
# El art. 236 grava como renta líquida el aumento de patrimonio que no
# expliquen tus rentas. Es la primera cuenta automática que hace la DIAN, y
# la fórmula de comparación es la del art. 237:
#
#     renta gravable + ganancia ocasional neta + rentas exentas
#       − impuestos de renta pagados durante el año
#
# patrimonio_liquido = 0

# Casilla «Impuesto neto de renta» de tu declaración del año anterior.
#
# Con este dato el motor te dice si te sirve el beneficio de auditoría del
# art. 689-3: subiendo el impuesto neto un 35% frente al año anterior, la
# declaración queda EN FIRME a los 6 MESES en vez de a los 36; con un 25%, a
# los 12. Para un independiente con ingresos creciendo suele estar al alcance
# sin hacer nada distinto, y cambia por completo el perfil de riesgo.
#
# Vigente para los años gravables 2024, 2025 y 2026 (Ley 2294 de 2023 art.
# 69). El texto del art. 689-3 dice «2022 y 2023»: quien lo lea solo en el
# Estatuto concluye que ya no aplica.
# impuesto_neto = 0

[verificaciones]
# Consignaciones PROVENIENTES DE ACTIVIDADES GRAVADAS CON IVA.
#
# El art. 437 par. 3 num. 6 no dice "todo lo que entró": dice consignaciones
# «provenientes de actividades gravadas con el impuesto sobre las ventas».
# Entonces NO cuentan los traslados entre tus propias cuentas, los préstamos
# recibidos, ni el dinero de terceros en tránsito. Y si tu actividad es
# exportación de servicios (art. 481 lit. c) o está excluida, esta cifra
# puede ser cero aunque por tus cuentas pasen cientos de millones.
#
# ⚠ Umbral de 3.500 UVT (4.000 si tus ingresos vienen de contratos con el
#   Estado, par. 5). Se mide sobre consignaciones y no sobre tu ingreso, así
#   que quien recibe plata de clientes y la redistribuye puede superarlo sin
#   que su ingreso se acerque. Es la contingencia menos mirada de este
#   perfil, y la que más se cuantifica mal. Sepárala con tu contador.
consignaciones_totales_anio = 0

# ¿Tienes la planilla PILA de cada contratista al que le pagaste?
contratistas_con_pila_verificada = false

# ¿Descargaste la información exógena y la conciliaste contra tu ledger?
#
# Es lo que la DIAN YA SABE de ti antes de que declares: tus clientes, bancos
# y plataformas reportaron lo que te pagaron y lo que te retuvieron. Un
# ingreso que un tercero reportó y tú no declaraste es una diferencia que la
# DIAN ve sin fiscalizar a nadie. Y una retención que TÚ declaras y nadie
# reportó es la causal expresa del art. 689-3 para perder el beneficio de
# auditoría.
#
# Va ANTES de calcular. Usa templates/conciliacion-exogena.md.
exogena_descargada_y_conciliada = false

# ¿Existe documento soporte de esos pagos, con numeración consecutiva?
tiene_documento_soporte_de_pagos = false

# ── Patrimonio a 31 de diciembre del año gravable ─────────────────────
# TODO: cuentas, billeteras, wallets, cripto, brokers, vehículos, inmuebles.
#
# Moneda extranjera: art. 269 ET, TRM del RECONOCIMIENTO INICIAL de cada
# partida, no la del 31 de diciembre. La regla del cierre es el texto viejo,
# derogado por la Ley 1819 de 2016.
#
# Un activo omitido que la DIAN detecte se grava como renta líquida sin
# derecho a costo (art. 239-1 ET), más sanción por inexactitud del 200%
# (art. 648 num. 1) — el doble de la ordinaria, justamente por omitir activos.

