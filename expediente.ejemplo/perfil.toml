#  EXPEDIENTE DE EJEMPLO — contribuyente ficticio
#
#  Perfil: desarrolladora independiente en Medellín, cliente único en EE.UU.
#  que le paga vía Deel en USD, subcontrata a dos personas, mantiene a su
#  madre. Cifras redondas e inventadas.
#
#  Sirve para: ver el flujo completo sin exponer nada, y como test de
#  regresión del motor.
#
#      bin/renta calcular --expediente "$PWD/expediente.ejemplo"
#
#  Fíjate en el resultado: la Ruta A gana, R-01 y R-02 salen en rojo, y las
#  dos palancas más grandes de la tabla cuestan más de lo que ahorran.

[contribuyente]
anio_gravable = 2025
residente_fiscal = true
# Desarrolladora independiente: presta servicios profesionales, que NO son
# actos de comercio (art. 20 C.Co.). Decide OBL-02.
es_comerciante = false
# Nombre INVENTADO. El motor no lo usa para nada: lo lee el escáner de
# privacidad con `--perfil` para poder encontrarlo en los entregables antes
# de que salgan al contador o a un issue.
nombre = "Yamile Restrepo Osorno"

# ── Las otras personas del expediente ─────────────────────────────────
# Tampoco las usa el motor. Están acá por la misma razón: sus nombres
# aparecen en los extractos y en el ledger, y el escáner no puede buscar lo
# que no sabe que existe. Todos inventados.
[personas]
conyuge = ""
madre = "Amparo Osorno Quintero"
contratistas = ["Nicolás Betancur Arango", "Sebastián Zuluaga Mejía"]

# ── Ingresos ──────────────────────────────────────────────────────────
# En pesos, ya convertidos con TRM diaria por engine/ledger.py.
[ingresos]
rentas_trabajo_honorarios = 184_700_786   # sale de 02-datos/ledger.csv, TRM diaria
rentas_capital            = 1_240_000     # rendimientos, certificado del banco
otras_rentas_no_laborales = 0

# ── Ingresos no constitutivos de renta ────────────────────────────────
# Restan ANTES del tope del 40% y no lo consumen. Es la mejor posición
# posible para una partida — por eso importa no ponerlos como deducción.
[incrngo]
aportes_obligatorios_salud_pension = 21_240_000   # PILA como independiente
componente_inflacionario           = 690_000      # certificado del banco
otros                              = 0

# ── Costos y gastos — SOLO se restan en la Ruta A ─────────────────────
# Cada peso exige factura electrónica o documento soporte. Los pagos a
# contratistas además exigen verificar sus aportes (art. 108 par. 2 ET).
[costos]
pagos_a_contratistas  = 48_000_000
comisiones_plataforma = 3_720_000
equipo_tecnologico    = 9_500_000
internet_software     = 5_400_000
arriendo_oficina      = 0
otros                 = 0

# ── Deducciones ───────────────────────────────────────────────────────
[deducciones]
gmf_pagado                      = 1_480_000   # total 4x1000; el motor toma el 50%
intereses_vivienda              = 0
medicina_prepagada              = 4_200_000
aportes_voluntarios             = 0           # ventana cerrada el 31-dic-2025
compras_con_factura_electronica = 0
dependientes                    = 1           # la madre, ingresos < 260 UVT

# ── Descuentos ────────────────────────────────────────────────────────
[descuentos]
donaciones_certificadas_rte = 0   # donó, pero sin certificado del RTE → vale $0

# ── Anticipos ─────────────────────────────────────────────────────────
[anticipos]
retenciones_practicadas     = 86_000   # sobre rendimientos financieros
saldo_a_favor_anio_anterior = 0

# ── Verificaciones de riesgo ──────────────────────────────────────────
[verificaciones]
# Consignaciones PROVENIENTES DE ACTIVIDADES GRAVADAS CON IVA (art. 437 par.
# 3 num. 6). No es "todo lo que entró": los traslados entre cuentas propias y
# el dinero de terceros en tránsito no cuentan. Tampoco es el ingreso propio.
consignaciones_totales_anio        = 198_000_000
contratistas_con_pila_verificada   = false   # ← riesgo R-02 abierto
tiene_documento_soporte_de_pagos   = false   # ← riesgo R-03 abierto

# ── Patrimonio a 31 de diciembre del año gravable ─────────────────────
[[patrimonio.activos]]
nombre = "Cuenta de ahorros"
valor  = 34_500_000

#  Ojo con la regla de este renglón: el art. 269 ET, modificado por la Ley
#  1819 de 2016 art. 116, valora los activos en moneda extranjera a la TRM
#  del RECONOCIMIENTO INICIAL —la del día en que entró cada partida— y no a
#  la del 31 de diciembre. La regla del cierre es el texto derogado en 2016,
#  y sigue circulando en material para contadores. Reexpresar a TRM de
#  cierre mueve el patrimonio y con él la renta por comparación patrimonial
#  (art. 236 ET), que es el riesgo R-05. Ver skills/renta-patrimonio.
[[patrimonio.activos]]
nombre = "Saldo en wallet de la plataforma (USD, TRM del reconocimiento inicial — art. 269)"
valor  = 12_800_000

[[patrimonio.activos]]
nombre = "Vehículo (avalúo)"
valor  = 42_000_000

[[patrimonio.pasivos]]
nombre = "Tarjeta de crédito"
valor  = 5_600_000
