#  Parámetros tributarios — AÑO GRAVABLE 2026 (se declara en 2027)
#
#  ⚠ INCOMPLETO. Solo está confirmada la UVT. Los demás parámetros se
#  heredan de AG2025 hasta que se verifique cada uno contra la norma
#  vigente para 2026. El motor advierte cuando usa un valor heredado.
#
#  Sirve HOY para planeación tributaria 2026: proyectar el impuesto del
#  año en curso y decidir aportes voluntarios antes del 31 de diciembre,
#  que es cuando la ventana se cierra.

[meta]
anio_gravable = 2026
anio_declaracion = 2027
revisado = "2026-07-28"
completo = false
hereda_de = "ag2025"
nota = "Verificar reforma tributaria y decretos reglamentarios de 2026 antes de usar para una declaración real."

[uvt]
valor = 52374
fuente = "Resolución DIAN 000238 del 15 de diciembre de 2025"
# La URL apunta a una fuente SECUNDARIA: es un blog, no la resolución. Se
# deja porque es lo que hay hoy y es mejor que nada, pero está marcada como
# tal a propósito — una cita cuya URL no lleva al texto oficial no es una
# cita verificada, y este año gravable está marcado como incompleto
# justamente por cosas así. Reemplázala por el PDF de la DIAN al verificar.
url = "https://actualicese.com/uvt-2026/"
url_verificada = false
url_oficial_pendiente = "Buscar la Resolución 000238/2025 en https://normograma.dian.gov.co"

# Los bloques [tarifa], [topes] y [sanciones] se heredan de
# knowledge/ag2025/parametros.toml mientras no se sobreescriban acá.
# engine/parametros.py hace la fusión y marca cada valor heredado.

# [plazos] NO se hereda: las fechas de ag2025 son para declarar el AÑO
# GRAVABLE 2025 y mostrarlas acá sería afirmar algo falso, no solo
# incompleto. Se dejan vacías hasta que salga el decreto correspondiente.
[plazos]
inicio = ""
fin = ""
criterio = "Escalonado por los dos últimos dígitos del NIT o cédula, sin dígito de verificación."
tabla_cargada = false
advertencia = """
Las fechas para declarar el año gravable 2026 se fijan por decreto, que suele
salir a finales del año anterior. Todavía no están cargadas acá. No uses las
de AG2025: son otras.
"""
url = "https://www.dian.gov.co/"

[umbrales.agente_retencion_persona_natural]
uvt = 30000
medido_sobre_anio = 2025
uvt_del_anio_medido = 49799
requiere_calidad_comerciante = true
nota = "Se mide contra el año inmediatamente anterior, así que para AG2026 la referencia es la UVT de 2025, no la de 2024."
fuente = "Estatuto Tributario art. 368-2"
