nota = """
Es la palanca de planeación más grande que existe para el perfil objetivo de
esta herramienta —un independiente con ingresos creciendo— y el repo no la
mencionaba ni una vez. Bajar la firmeza de 36 meses a 6 cambia por completo
el perfil de riesgo de una declaración.

TEXTO LITERAL del art. 689-3, verificado el 2026-07-29 contra el normograma
de la DIAN (Ley 2155 de 2021 art. 51, que es el que lo adiciona):

  «Para los periodos gravables 2022 y 2023, la liquidación privada de los
  contribuyentes del impuesto sobre la renta y complementarios que
  incrementen su impuesto neto de renta en por lo menos un porcentaje mínimo
  del treinta y cinco por ciento (35%), en relación con el impuesto neto de
  renta del año inmediatamente anterior, quedará en firme si dentro de los
  seis (6) meses siguientes a la fecha de su presentación no se hubiere
  notificado emplazamiento para corregir o requerimiento especial o
  emplazamiento especial o liquidación provisional, siempre que la
  declaración sea debidamente presentada en forma oportuna y el pago total se
  realice en los plazos que para tal efecto fije el Gobierno nacional.»

  «Si el incremento del impuesto neto de renta es de al menos un porcentaje
  mínimo del veinticinco por ciento (25%), en relación con el impuesto neto
  de renta del año inmediatamente anterior, la declaración de renta quedará
  en firme si dentro de los doce (12) meses siguientes a la fecha de su
  presentación no se hubiere notificado emplazamiento para corregir o
  requerimiento especial o emplazamiento especial o liquidación provisional,
  siempre que la declaración sea debidamente presentada en forma oportuna y
  el pago total se realice en los plazos que para tal efecto fije el Gobierno
  nacional.»

  «PARÁGRAFO 2o. Cuando el impuesto neto sobre la renta de la declaración
  correspondiente al año gravable frente al cual debe cumplirse el requisito
  del incremento sea inferior a 71 UVT, no procederá la aplicación del
  beneficio de auditoría.»

VIGENCIA PARA 2024–2026, verificada en la misma fuente. El texto del art.
689-3 dice «2022 y 2023»; la prórroga NO está en el Estatuto sino en la ley
del plan de desarrollo, y por eso es fácil leer el artículo y concluir que
ya no aplica:

  «ARTÍCULO 69. EL BENEFICIO DE AUDITORÍA. Prorróguese por los años gravables
  2024, 2025 y 2026 el beneficio de auditoría consagrado en el artículo 51 de
  la Ley 2155 de 2021.»

CONDICIONES QUE SE PIERDEN AL RESUMIR, y las tres muerden en este perfil:

  1. Presentación OPORTUNA y **PAGO TOTAL** dentro del plazo. Un saldo a
     pagar en cuotas o un día tarde y el beneficio se cae entero.
  2. Si la declaración arroja PÉRDIDA FISCAL, la DIAN conserva la facultad de
     fiscalizarla aunque haya corrido el término. Es relevante acá: el
     Decreto 1625 art. 1.2.1.20.5 inciso 5 dice que con UN SOLO tipo de renta
     los costos que exceden los ingresos producen pérdida fiscal declarable.
  3. No aplica a quien tenga beneficios por ubicación en zona geográfica
     determinada, ni cuando se demuestre que las retenciones declaradas son
     inexistentes.

El piso de las 71 UVT se mide sobre el impuesto neto del año CONTRA EL CUAL
se compara —el anterior—, no sobre el del año que se declara.

⚠ El motor solo puede evaluar esto si el perfil trae
`anio_anterior.impuesto_neto`. Sin ese dato, el chequeo R-16 dice que no
puede concluir en vez de suponer.
"""
