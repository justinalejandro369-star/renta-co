# ─────────────────────────────────────────────────────────────────────
#  Topes de la depuración de la cédula general
# ─────────────────────────────────────────────────────────────────────
[topes]

[topes.conjunto_deducciones_exentas]
# Tope conjunto para rentas exentas + deducciones especiales
porcentaje_ingresos_netos = 0.40
tope_uvt = 1340
fuente = "Estatuto Tributario art. 336 num. 3"
url = "https://estatuto.co/336"

[topes.renta_exenta_25]
porcentaje = 0.25
tope_anual_uvt = 790
nota = """
⚠ 790 UVT ANUALES, no 240 UVT mensuales. La Ley 2277 de 2022 art. 2 reemplazó
el límite mensual de 240 UVT por uno anual de 790 UVT. El texto de los 240 UVT
mensuales es el de la Ley 1607 de 2012 y sigue circulando en blogs y en
material de contadores: es la fuente de error más común de esta cédula, y
sobreestima la exención en 3,6 veces.

La base NO es el ingreso bruto. El inciso 2 del numeral 10 exige calcularla
'una vez se detraiga del valor total de los pagos laborales los ingresos no
constitutivos de renta, las deducciones y las rentas exentas diferentes a la
establecida en el presente numeral'.

El resultado además compite dentro del tope conjunto de 40% / 1.340 UVT.
"""
fuente = "Estatuto Tributario art. 206 num. 10, modificado por Ley 2277 de 2022 art. 2"
url = "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2277_2022.htm"

[topes.dependientes_72uvt]
uvt_por_dependiente = 72
maximo_dependientes = 4
dentro_del_tope_conjunto = false
requiere_soporte_de_gasto = false
nota = """
Se acredita la CONDICIÓN de dependiente, no un desembolso. Es la deducción
más eficiente disponible: no consume el tope del 40%.

Definición de dependiente actualizada por la Ley 2411 de 2024, aplicable
desde el año gravable 2025:
  · Hijos hasta 18 años.
  · Hijos entre 18 y 25 años (antes 23) cuando el contribuyente financia su
    educación en instituciones de educación superior certificadas por el
    ICFES, o en programas técnicos de educación no formal acreditados.
  · Hijos MAYORES DE 18 (antes 23) en situación de dependencia por factores
    físicos o psicológicos, certificada por el MINISTERIO DE SALUD Y
    PROTECCIÓN SOCIAL (antes Medicina Legal).
  · Cónyuge o compañero(a) permanente, y padres y hermanos, en dependencia
    por ausencia de ingresos o con ingresos anuales inferiores a 260 UVT,
    certificada por CONTADOR PÚBLICO, o por dependencia física o psicológica.
"""
fuente = "ET art. 336 num. 3 inciso 2 (Ley 2277 de 2022 art. 7); definición de dependiente en ET art. 387 par. 2, modificado por Ley 2411 de 2024 art. 2"
url = "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2411_2024.htm"

[topes.tope_indicativo_costos]
porcentaje_ingresos_brutos = 0.60
nota = """
La Ruta A no tiene un tope que recorte la deducción, pero SÍ tiene un umbral
con consecuencias, que suele pasarse por alto:

El art. 336-1 estima los costos y gastos deducibles de rentas de trabajo en
el 60% de los ingresos brutos. Superarlo es legítimo, pero obliga a
indicarlo EXPRESAMENTE en la declaración marcando la casilla informativa.
No marcarla acarrea la sanción del art. 651 num. 1 lit. d).

Además exige que esos costos estén soportados con FACTURA ELECTRÓNICA de
venta, nómina electrónica o documentos equivalentes electrónicos — lo que
tensiona directamente la estrategia de documento soporte físico del riesgo
R-03. Quien piense superar el 60% debe mirar los dos requisitos juntos.
"""
fuente = "Estatuto Tributario art. 336-1, adicionado por Ley 2277 de 2022 art. 60"
url = "https://estatuto.co/336-1"

[topes.costos_por_tipo_de_renta]
aplica = true
dentro_del_tope_conjunto = false
nota = """
La Ruta A no tiene un tope GLOBAL sobre los costos, pero sí uno por tipo de
renta, que se pasa por alto con frecuencia porque no está en el Estatuto sino
en el reglamento:

  «En ningún caso los costos y gastos … podrán superar el valor resultante de
  restar de los ingresos del respectivo tipo de renta los ingresos no
  constitutivos de renta ni ganancia ocasional imputables a ese mismo tipo.»

O sea que el exceso de costos de un tipo de renta NO genera una pérdida que se
pueda restar de los otros tipos de la misma cédula. Quien tuvo un mal año en
honorarios y a la vez recibió rendimientos o arriendos no puede cruzar lo uno
contra lo otro.

Para aplicarlo hay que saber a qué tipo de renta pertenece cada costo. El
perfil lo pregunta en el bloque opcional [costos.atribucion]; si no está, el
motor usa la única ACTIVIDAD con ingresos que tenga el contribuyente, y si
tiene las dos, deja los costos sin atribuir y lo dice en el chequeo R-11 en
vez de repartirlos a ojo.
"""
fuente = "Decreto 1625 de 2016 art. 1.2.1.20.5 inciso final, sustituido por el Decreto 2231 de 2023"
url = "https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=228049"

[topes.dependientes_10pct]
porcentaje_renta_trabajo = 0.10
tope_mensual_uvt = 32
meses = 12
dentro_del_tope_conjunto = true
excluyente_con = "dependientes_72uvt"
nota = """
Excluyente con la deducción de 72 UVT PARA EL MISMO DEPENDIENTE, no para el
contribuyente: el Decreto 1625 art. 1.2.1.20.3 dice «un mismo dependiente solo
dará lugar a una de estas dos deducciones».

Como esta deducción NO depende de cuántos dependientes haya, gastar más de uno
en ella es tirarlos. La combinación que casi siempre gana con el tope conjunto
libre es: el 10% por UNO y 72 UVT por cada uno de los demás. El motor evalúa
las tres —72 UVT puras, 10% puro y la mezcla— y toma la mejor.

Por lo mismo el quinto dependiente todavía vale: cuatro por 72 UVT (que es
donde topa el art. 336 num. 3 inciso 2) y uno por el 10%.
"""
fuente = "Estatuto Tributario art. 387"
url = "https://estatuto.co/387"

