# ─────────────────────────────────────────────────────────────────────
#  Renta por comparación patrimonial — arts. 236 y 237
# ─────────────────────────────────────────────────────────────────────
[comparacion_patrimonial]
aplica = true
url_verificada = true
verificado_el = 2026-07-29
nota = """
Es la primera cuenta que hace la DIAN de forma automática, y el motor no la
corría.

⚠ LA PRIMERA VERSIÓN DE ESTE BLOQUE SE ESCRIBIÓ DE MEMORIA y tenía los dos
artículos mal. Es la quinta cita inexacta de este archivo, y la única cuyo
error cambia el CÁLCULO y no solo el texto. Queda escrita porque enseña
exactamente lo que este repo sigue haciendo mal: parafrasear una norma que
no se abrió.

  · El art. 236 decía «el aumento se debe a causas justificativas»; la norma
    dice «el aumento patrimonial obedece a causas justificativas».
  · El art. 237 lo describía como «ajustes por inflación y valorizaciones
    nominales». No es eso: es la FÓRMULA DE AJUSTE, y define contra qué se
    compara el incremento. Con la descripción inventada, R-15 comparaba
    contra la renta líquida a secas y habría acusado de patrimonio
    injustificado a quien tiene rentas exentas altas.

TEXTO LITERAL, verificado el 2026-07-29 contra el Estatuto Tributario
compilado en el normograma de la DIAN:

  «Cuando la suma de la renta gravable, las rentas exentas y la ganancia
  ocasional neta, resultare inferior a la diferencia entre el patrimonio
  líquido del último período gravable y el patrimonio líquido del período
  inmediatamente anterior, dicha diferencia se considera renta gravable, a
  menos que el contribuyente demuestre que el aumento patrimonial obedece a
  causas justificativas.»

  «Para efectos de la determinación de la renta por comparación de
  patrimonios, a la renta gravable se adicionará el valor de la ganancia
  ocasional neta y las rentas exentas. De esta suma, se sustrae el valor de
  los impuestos de renta y complementarios pagados durante el año gravable.»

LO QUE ESO SIGNIFICA para el chequeo R-15:

    justificado = renta gravable
                + ganancia ocasional neta      ← fuera del alcance del motor
                + rentas exentas
                − impuestos de renta y complementarios PAGADOS en el año

Los dos últimos términos van en direcciones opuestas y ninguno estaba: las
rentas exentas suben lo justificado (menos alarmas) y los impuestos pagados
lo bajan (más alarmas). El motor usa las retenciones practicadas como cota
de los impuestos pagados y lo dice en el detalle del chequeo, porque el
perfil no tiene el pago del saldo del año anterior.

Lo que justifica el incremento y el motor NO ve: valorizaciones nominales de
inmuebles, herencias y donaciones (van a ganancia ocasional, fuera de
alcance), y préstamos recibidos —que suben el activo y el pasivo a la vez—.
Lo que NO lo justifica es el ingreso no declarado, que es justo lo que este
chequeo busca.

⚠ Requiere `anio_anterior.patrimonio_liquido`. Sin ese dato el chequeo R-15
dice que no puede concluir.
"""
cita_literal = [
