# ─────────────────────────────────────────────────────────────────────
#  Información exógena
# ─────────────────────────────────────────────────────────────────────
[exogena]
nota = """
La conciliación contra la exógena es la PRIMERA parada de cualquier contador
y en este repo estaba como plan B en el bloque de cierre. Es lo que la DIAN
ya sabe de ti antes de que declares: los terceros —clientes, bancos,
plataformas— reportan lo que te pagaron y lo que te retuvieron, y de ahí sale
la declaración sugerida del Muisca.

Consecuencia práctica: un ingreso que un tercero reportó y tú no declaraste
es una diferencia que la DIAN ve sin fiscalizar a nadie. Y al revés, una
retención que tú declaras y nadie reportó es la causal expresa del art. 689-3
para perder el beneficio de auditoría.

Se baja del portal de la DIAN (Consulta de información exógena reportada por
terceros) y se compara contra el ledger antes de calcular nada.

Este bloque no trae cifras: es una obligación de PROCESO, no un parámetro.
El chequeo que la exige es R-17.
"""
fuente = "Estatuto Tributario arts. 631 y 631-3; resolución anual de la DIAN que fija los obligados y los plazos"
url = "https://www.dian.gov.co/"
