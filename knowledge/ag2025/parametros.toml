[topes.descuento_donaciones]
porcentaje_descuento = 0.25
tope_porcentaje_impuesto = 0.25
porcentaje_bancos_de_alimentos = 0.37
nota = "Es DESCUENTO (resta del impuesto), no deducción. Exige certificación firmada por representante legal y revisor fiscal o contador de una entidad del Régimen Tributario Especial. Una transferencia a una persona o a una colecta informal vale $0. El 37% para donaciones a bancos de alimentos (art. 257 par. 1, Ley 2380 de 2024) todavía no está implementado en el motor."
fuente = "El 25% del valor donado está en el ET art. 257. El límite conjunto del 25% del impuesto, y el traslado del excedente a un período siguiente, están en el ET art. 258."
url = "https://estatuto.co/258"

# ─────────────────────────────────────────────────────────────────────
#  Umbrales de obligación
# ─────────────────────────────────────────────────────────────────────
[umbrales]

[umbrales.obligado_a_declarar]
ingresos_brutos_uvt = 1400
patrimonio_bruto_uvt = 4500
consumos_tarjeta_credito_uvt = 1400
compras_y_consumos_uvt = 1400
consignaciones_uvt = 1400
nota = "Basta cumplir UNO para quedar obligado. El patrimonio se mide al último día del año gravable; los demás, durante el año."
fuente = "Decreto 1625 de 2016 art. 1.6.1.13.2.7"

[umbrales.no_responsable_iva]
ingresos_brutos_uvt = 3500
consignaciones_uvt = 3500
contrato_individual_uvt = 3500
consignaciones_uvt_contratistas_del_estado = 4000
maximo_establecimientos = 1
nota = """
El umbral de consignaciones tiene un calificador que decide el caso y que se
omite con frecuencia: el art. 437 par. 3 num. 6 dice «consignaciones
bancarias, depósitos o inversiones financieras PROVENIENTES DE ACTIVIDADES
GRAVADAS CON EL IMPUESTO SOBRE LAS VENTAS -IVA».

O sea que NO cuenta todo lo que entró a la cuenta. Un traslado entre cuentas
propias, un préstamo recibido o dinero de terceros en tránsito no provienen
de una actividad gravada. Y si la actividad del contribuyente es exportación
de servicios (art. 481 lit. c) o está excluida, el numerador puede ser cero
aunque por la cuenta pasen cientos de millones.

Sigue siendo una contingencia real y poco mirada —el umbral se mide sobre
consignaciones y no sobre el ingreso propio, así que un intermediario puede
superarlo—, pero cuantificarla exige separar por origen, no sumar entradas.

El par. 5 del mismo artículo eleva el límite a 4.000 UVT para prestadores de
servicios personas naturales que derivan sus ingresos de contratos con el
Estado.
"""
fuente = "Estatuto Tributario art. 437 par. 3 num. 6 y par. 5"
url = "https://estatuto.co/437"

[umbrales.agente_retencion_persona_natural]
uvt = 30000
medido_sobre_anio = 2024
uvt_del_anio_medido = 47065
requiere_calidad_comerciante = true
nota = "Dos filtros CONCURRENTES: ser comerciante en el sentido del art. 20 C.Co., Y superar 30.000 UVT de patrimonio o ingresos brutos del año anterior. Un profesional independiente que presta servicios NO es comerciante, así que no es agente de retención sin importar el monto."
fuente = "Estatuto Tributario art. 368-2"
url = "https://estatuto.co/368-2"

[umbrales.dependiente_ingresos]
